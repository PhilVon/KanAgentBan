name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22]
        include:
          - os: windows-latest
            node: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The optional fontawesome-pro package resolves to the authenticated
      # npm.fontawesome.com registry, which a tokenless runner can't fetch —
      # but --omit=optional would also drop rollup/esbuild native binaries.
      # Strip just the pro entry from both manifests, then a normal npm ci.
      # Free FA is a regular dep and copy-web-assets falls back to it.
      - name: Drop fontawesome-pro (auth-only registry)
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            delete pkg.optionalDependencies;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
            delete lock.packages[''].optionalDependencies;
            delete lock.packages['node_modules/@fortawesome/fontawesome-pro'];
            fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2));
          "
      - run: npm ci
      - run: npm run build
      - run: npm test
